<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Tutor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="page-card form-card">
        <h1>Login to Chinnu The Buddy, your AI tutor</h1>
        <p class="secondary-text">Enter your details to access your AI tutor.</p>
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <div class="button-row">
                <button class="button primary" type="submit">Login</button>
            </div>
            <p class="secondary-text">Don't have an account? <a href="/register">Register</a></p>
            <p id="login-message" class="message"></p>
        </form>
    </main>
    <script src="/static/auth.js"></script>
</body>
</html>
